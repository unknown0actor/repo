name: rebuild repo index

# 在 GitHub 网页/App 里往 debs/ 上传 .deb 后，这里自动重建
# Packages / Packages.gz / Release / depictions/ / index.html 并提交回来。
on:
  push:
    paths:
      - 'debs/**'
      - 'build-repo.sh'
      - '.github/workflows/rebuild.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-index
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild index
        env:
          NO_BZ2: '1'
        run: sh build-repo.sh

      - name: Commit generated files if changed
        run: |
          set -eu
          if [ -z "$(git status --porcelain -- Packages Packages.gz Release index.html depictions)" ]; then
            echo "索引无变化，跳过提交"
            exit 0
          fi
          git config user.name "unknown0actor"
          git config user.email "unknown0actor@users.noreply.github.com"
          git add -A -- Packages Packages.gz Release index.html depictions
          git commit -m "自动重建源索引"
          git push
